<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особистий кабінет — Медова Пасіка 🐝</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-amber: #ff9800;
            --dark-amber: #e65100;
            --light-amber: #fff8e1;
            --bg-gradient: linear-gradient(135deg, #fffde7 0%, #fff9c4 40%, #ffe082 100%);
            --card-shadow: 0 8px 24px rgba(230, 81, 0, 0.08), 0 2px 8px rgba(255, 152, 0, 0.1);
            --text-main: #3e2723;
            --text-secondary: #5d4037;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); min-height: 100vh; font-size: 0.95rem; }

        /* --- Авторизация --- */
        .auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { max-width: 450px; width: 100%; background: #fff; border-radius: 24px; padding: 35px; box-shadow: var(--card-shadow); border: 2px solid #ffecb3; }
        .auth-container h1 { font-family: 'Comfortaa', cursive; color: var(--dark-amber); text-align: center; margin-bottom: 25px; font-size: 1.5rem; }

        /* --- Кабинет --- */
        .dashboard-wrapper { display: none; max-width: 700px; margin: 0 auto; padding: 25px 15px; }
        .dash-header { text-align: center; margin-bottom: 25px; }
        .dash-header h1 { font-family: 'Comfortaa', cursive; color: var(--dark-amber); font-size: 1.5rem; margin-bottom: 5px; }
        .dash-header p { color: var(--text-secondary); font-size: 0.9rem; }

        /* --- АККОРДЕООН --- */
        .accordion-item { background: #fff; border: 2px solid #ffecb3; border-radius: 16px; margin-bottom: 14px; box-shadow: var(--card-shadow); overflow: hidden; }
        .accordion-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; cursor: pointer; transition: background 0.2s; user-select: none; }
        .accordion-header:hover { background: var(--light-amber); }
        .accordion-title { display: flex; align-items: center; gap: 12px; font-weight: 700; color: var(--dark-amber); font-size: 1.05rem; }
        .accordion-title .icon { font-size: 1.4rem; }
        .accordion-arrow { font-size: 1.2rem; color: var(--primary-amber); transition: transform 0.3s ease; }
        .accordion-item.open .accordion-arrow { transform: rotate(180deg); }
        .accordion-item.open .accordion-header { background: var(--light-amber); border-bottom: 2px dashed #ffe0b2; }
        .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
        .accordion-body-inner { padding: 20px; }

        /* --- Формы --- */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-secondary); font-size: 0.9rem; }
        .form-control { width: 100%; padding: 12px 16px; border: 2px solid #ffe0b2; border-radius: 12px; font-size: 0.95rem; background: #fffde7; outline: none; transition: all 0.3s ease; }
        .form-control:focus { border-color: var(--primary-amber); background: #fff; box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.15); }
        .form-control:disabled { background: #f5f5f5; color: #9e9e9e; cursor: not-allowed; }
        .btn { background: linear-gradient(135deg, #ffb300 0%, #f57c00 100%); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; box-shadow: 0 4px 12px rgba(245, 124, 0, 0.3); transition: transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(245, 124, 0, 0.4); }
        .btn-secondary { background: #8d6e63; }
        .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: #fff; color: #333; border: 2px solid #ffe0b2; margin-top: 15px; transition: all 0.2s; }
        .btn-google:hover { background: #fffde7; transform: translateY(-2px); }
        .divider { text-align: center; margin: 20px 0; position: relative; color: #8d6e63; font-size: 0.85rem; font-weight: 600; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 2px; background: #ffe0b2; }
        .divider::before { left: 0; } .divider::after { right: 0; }
        .switch-mode { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #666; }
        .switch-mode a { color: var(--dark-amber); font-weight: 700; cursor: pointer; text-decoration: underline; }

        /* --- Заказы --- */
        .order-card { background: var(--light-amber); border: 1px solid #ffe082; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
        .order-date { font-weight: 700; color: var(--dark-amber); font-size: 0.9rem; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; background: #e0f2f1; color: #00796b; }
        .order-total { font-size: 1.05rem; font-weight: 700; }
        .btn-details { background: none; border: 2px solid var(--primary-amber); color: var(--dark-amber); padding: 6px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; margin-top: 10px; transition: all 0.2s; }
        .btn-details:hover { background: var(--primary-amber); color: white; }
        .order-details { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ffcc80; font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; }
        .order-details.show { display: block; }

        /* --- Избранное --- */
        .wishlist-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--light-amber); border-radius: 10px; margin-bottom: 10px; border: 1px solid #ffe0b2; }
        .empty-hint { color: #8d6e63; font-size: 0.9rem; }

        .logout-btn { margin-top: 10px; }
    </style>
</head>
<body>

    <!-- ================= АВТОРИЗАЦІЯ ================= -->
    <div id="authWrapper" class="auth-wrapper">
        <div class="auth-container">
            <h1 id="authTitle">🔐 Вхід в акаунт</h1>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group"><label>Телефон або Email:</label><input type="text" id="loginLogin" class="form-control" required placeholder="Ваш телефон або email"></div>
                <div class="form-group"><label>Пароль:</label><input type="password" id="loginPass" class="form-control" required placeholder="Ваш пароль"></div>
                <button type="submit" class="btn">Увійти в акаунт 🐝</button>
                <div class="divider">або</div>
                <button type="button" class="btn btn-google" onclick="loginWithGoogle()">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.19-1.84H9v3.48h4.84c-.21 1.12-.84 2.07-1.79 2.71v2.25h2.9c1.7-1.57 2.69-3.88 2.69-6.6z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.25c-.81.54-1.84.86-3.06.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.46 15.83 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.72c-.18-.54-.28-1.12-.28-1.72s.1-1.18.28-1.72V4.95H.96C.35 6.18 0 7.55 0 9s.35 2.82.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0 5.48 0 2.46 2.17.96 4.95l3.01 2.33c.71-2.13 2.69-3.7 5.03-3.7z"/></svg>
                    Увійти через Google
                </button>
                <div class="switch-mode">Ще немає акаунта? <a onclick="switchMode('register')">Зареєструватися</a></div>
            </form>
            <form id="registerForm" onsubmit="handleRegister(event)" style="display:none;">
                <div class="form-group"><label>Телефон або Email:</label><input type="text" id="regLogin" class="form-control" required placeholder="+380... або example@mail.com"></div>
                <div class="form-group"><label>Пароль:</label><input type="password" id="regPass" class="form-control" required placeholder="Мінімум 4 символи"></div>
                <button type="submit" class="btn">Зареєструватися 🍯</button>
                <div class="divider">або</div>
                <button type="button" class="btn btn-google" onclick="loginWithGoogle()">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.19-1.84H9v3.48h4.84c-.21 1.12-.84 2.07-1.79 2.71v2.25h2.9c1.7-1.57 2.69-3.88 2.69-6.6z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.25c-.81.54-1.84.86-3.06.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.46 15.83 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.72c-.18-.54-.28-1.12-.28-1.72s.1-1.18.28-1.72V4.95H.96C.35 6.18 0 7.55 0 9s.35 2.82.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0 5.48 0 2.46 2.17.96 4.95l3.01 2.33c.71-2.13 2.69-3.7 5.03-3.7z"/></svg>
                    Увійти через Google
                </button>
                <div class="switch-mode">Вже маєте акаунт? <a onclick="switchMode('login')">Увійти</a></div>
            </form>
        </div>
    </div>

    <!-- ================= ОСОБИСТИЙ КАБІНЕТ (АККОРДЕООН) ================= -->
    <div id="dashboardWrapper" class="dashboard-wrapper">
        <div class="dash-header">
            <h1>🌻 Особистий кабінет</h1>
            <p id="sidebarUserLogin">user@example.com</p>
        </div>

        <!-- 1. Профіль -->
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">
                <div class="accordion-title"><span class="icon">👤</span> Мій профіль</div>
                <span class="accordion-arrow">▼</span>
            </div>
            <div class="accordion-body"><div class="accordion-body-inner">
                <form onsubmit="saveProfileData(event)">
                    <div class="form-group"><label>Логін (Телефон / Email):</label><input type="text" id="profLoginDisplay" class="form-control" disabled></div>
                    <div class="form-group"><label>ПІБ:</label><input type="text" id="profFullName" class="form-control" placeholder="Іванов Іван Іванович"></div>
                    <div class="form-group"><label>Адреса доставки:</label><input type="text" id="profAddress" class="form-control" placeholder="м. Одеса, Нова Пошта №5"></div>
                    <button type="submit" class="btn">Зберегти зміни 💾</button>
                </form>
            </div></div>
        </div>

        <!-- 2. Замовлення -->
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">
                <div class="accordion-title"><span class="icon">📦</span> Мої замовлення</div>
                <span class="accordion-arrow">▼</span>
            </div>
            <div class="accordion-body"><div class="accordion-body-inner">
                <div id="userOrdersList">Натисніть, щоб завантажити замовлення...</div>
            </div></div>
        </div>

        <!-- 3. Список бажань -->
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">
                <div class="accordion-title"><span class="icon">💛</span> Список бажань</div>
                <span class="accordion-arrow">▼</span>
            </div>
            <div class="accordion-body"><div class="accordion-body-inner">
                <div id="userWishlistList"><p class="empty-hint">Ваш список бажань поки порожній 🐝</p></div>
            </div></div>
        </div>

        <!-- 4. Налаштування -->
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">
                <div class="accordion-title"><span class="icon">⚙️</span> Налаштування</div>
                <span class="accordion-arrow">▼</span>
            </div>
            <div class="accordion-body"><div class="accordion-body-inner">
                <div id="passwordChangeCard">
                    <form onsubmit="changePassword(event)">
                        <div class="form-group"><label>Старий пароль:</label><input type="password" id="oldPass" class="form-control" required placeholder="Введіть поточний пароль"></div>
                        <div class="form-group"><label>Новий пароль:</label><input type="password" id="newPass" class="form-control" required placeholder="Мінімум 4 символи"></div>
                        <button type="submit" class="btn btn-secondary">Змінити пароль 🔑</button>
                    </form>
                </div>
            </div></div>
        </div>

        <button class="btn btn-secondary logout-btn" onclick="handleLogout()">Вийти з акаунта 🚪</button>
    </div>

    <script>
        const SUPABASE_URL = "https://qqfnbzfmjemknxivfktb.supabase.co";
        const SUPABASE_KEY = "sb_publishable__wWNK3PiFLCj29ofrP_jbw_jWGIv3-1";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('medova_current_user')) || null; } catch(e) { currentUser = null; }

        // --- АККОРДЕООН: открыть/закрыть секцию ---
        function toggleAccordion(header) {
            const item = header.parentElement;
            const body = item.querySelector('.accordion-body');
            const isOpen = item.classList.contains('open');

            // Закрываем все остальные
            document.querySelectorAll('.accordion-item.open').forEach(el => {
                el.classList.remove('open');
                el.querySelector('.accordion-body').style.maxHeight = null;
            });

            // Открываем выбранную (если была закрыта)
            if (!isOpen) {
                item.classList.add('open');
                body.style.maxHeight = body.scrollHeight + "px";
                // Подгружаем данные при открытии заказов
                if (item.querySelector('#userOrdersList')) renderOrders();
            }
        }

        function toggleOrderDetails(btn) {
            const details = btn.nextElementSibling;
            details.classList.toggle('show');
            btn.textContent = details.classList.contains('show') ? 'Сховати деталі' : 'Деталі замовлення';
            // Пересчитываем высоту аккордеона, чтобы детали влезли
            const body = btn.closest('.accordion-body');
            if (body) body.style.maxHeight = body.scrollHeight + "px";
        }

        async function checkGoogleAuthRedirect() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session && session.user) {
                    const googleEmail = session.user.email;
                    const googleName = session.user.user_metadata?.full_name || '';
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/users?login=eq.${encodeURIComponent(googleEmail)}`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
                    const existingUsers = await response.json();
                    if (existingUsers && existingUsers.length > 0) { currentUser = existingUsers[0]; }
                    else {
                        const newGoogleUser = { id: 'usr_' + Date.now(), login: googleEmail, pass: 'google_oauth_secure', full_name: googleName, address: '', data: { orders: [], wishlist: [] } };
                        const createRes = await fetch(`${SUPABASE_URL}/rest/v1/users`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=representation' }, body: JSON.stringify(newGoogleUser) });
                        if (createRes.ok) currentUser = newGoogleUser;
                    }
                    if (currentUser) { localStorage.setItem('medova_current_user', JSON.stringify(currentUser)); window.history.replaceState({}, document.title, window.location.pathname); }
                }
            } catch (err) { console.error("Помилка Google сесії:", err); }
        }

        async function loginWithGoogle() {
            try { await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } }); }
            catch (err) { alert("Не вдалося ініціювати вхід через Google."); }
        }

        async function initAccountPage() {
            await checkGoogleAuthRedirect();
            try { currentUser = JSON.parse(localStorage.getItem('medova_current_user')) || null; } catch(e) { currentUser = null; }
            const authWrapper = document.getElementById('authWrapper');
            const dashboardWrapper = document.getElementById('dashboardWrapper');
            if (!currentUser) { authWrapper.style.display = 'flex'; dashboardWrapper.style.display = 'none'; }
            else {
                authWrapper.style.display = 'none'; dashboardWrapper.style.display = 'block';
                document.getElementById('sidebarUserLogin').innerText = currentUser.login;
                document.getElementById('profLoginDisplay').value = currentUser.login;
                document.getElementById('profFullName').value = currentUser.full_name || '';
                document.getElementById('profAddress').value = currentUser.address || '';
                const passCard = document.getElementById('passwordChangeCard');
                if (passCard) passCard.style.display = (currentUser.pass === 'google_oauth_secure') ? 'none' : 'block';
                renderWishlist();
            }
        }

        function switchMode(mode) {
            const regForm = document.getElementById('registerForm');
            const loginForm = document.getElementById('loginForm');
            const title = document.getElementById('authTitle');
            if (mode === 'login') { regForm.style.display = 'none'; loginForm.style.display = 'block'; title.innerText = '🔐 Вхід в акаунт'; }
            else { loginForm.style.display = 'none'; regForm.style.display = 'block'; title.innerText = '👤 Реєстрація акаунта'; }
        }

        function validateInput(val) {
            const clean = val.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phoneRegex = /^\+?[0-9]{9,15}$/;
            if (emailRegex.test(clean) || phoneRegex.test(clean.replace(/[\s\-\(\)]/g, ''))) return clean;
            return null;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const validLogin = validateInput(document.getElementById('regLogin').value);
            const pass = document.getElementById('regPass').value.trim();
            if (!validLogin) return alert("Введіть коректний номер телефону або Email.");
            if (pass.length < 4) return alert("Пароль занадто короткий (мінімум 4 символи).");
            const newUserData = { id: 'usr_' + Date.now(), login: validLogin, pass: pass, full_name: '', address: '', data: { orders: [], wishlist: [] } };
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=representation' }, body: JSON.stringify(newUserData) });
                if (!response.ok) { const err = await response.json(); if (err.code === '23505') { alert("Користувач з таким логіном вже зареєстрований!"); return switchMode('login'); } throw new Error(err.message); }
                currentUser = newUserData; localStorage.setItem('medova_current_user', JSON.stringify(currentUser));
                alert("Реєстрація успішна! Ласкаво просимо на пасіку! 🍯"); initAccountPage();
            } catch (err) { alert("Помилка: " + err.message); }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const validLogin = validateInput(document.getElementById('loginLogin').value);
            const pass = document.getElementById('loginPass').value.trim();
            if (!validLogin) return alert("Введіть коректний телефон або email.");
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?login=eq.${encodeURIComponent(validLogin)}&pass=eq.${encodeURIComponent(pass)}`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
                const users = await response.json();
                if (users && users.length > 0) { currentUser = users[0]; localStorage.setItem('medova_current_user', JSON.stringify(currentUser)); alert("Вхід успішний! Раді бачити знову! 🐝"); initAccountPage(); }
                else { alert("Невірний логін або пароль."); }
            } catch (err) { alert("Помилка зв'язку з базою даних."); }
        }

        async function changePassword(e) {
            e.preventDefault();
            if (currentUser.pass === 'google_oauth_secure') return alert("Користувачі Google не використовують звичайний пароль.");
            const oldPass = document.getElementById('oldPass').value.trim();
            const newPass = document.getElementById('newPass').value.trim();
            if (oldPass !== currentUser.pass) return alert("Невірний старий пароль.");
            if (newPass.length < 4) return alert("Новий пароль занадто короткий.");
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${currentUser.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=representation' }, body: JSON.stringify({ pass: newPass }) });
                if (!response.ok) throw new Error("Помилка");
                currentUser.pass = newPass; localStorage.setItem('medova_current_user', JSON.stringify(currentUser));
                alert("Пароль успішно змінено!"); document.getElementById('oldPass').value = ''; document.getElementById('newPass').value = '';
            } catch (err) { alert("Не вдалося оновити пароль."); }
        }

        function handleLogout() { currentUser = null; localStorage.removeItem('medova_current_user'); supabaseClient.auth.signOut(); initAccountPage(); }

        async function saveProfileData(e) {
            e.preventDefault();
            currentUser.full_name = document.getElementById('profFullName').value.trim();
            currentUser.address = document.getElementById('profAddress').value.trim();
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${currentUser.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'return=representation' }, body: JSON.stringify({ full_name: currentUser.full_name, address: currentUser.address, data: currentUser.data }) });
                if (!response.ok) throw new Error("Помилка");
                localStorage.setItem('medova_current_user', JSON.stringify(currentUser)); alert("Зміни збережено! 🍯");
            } catch (err) { alert("Не вдалося зберегти зміни."); }
        }

        function renderWishlist() {
            const container = document.getElementById('userWishlistList');
            const wishlist = currentUser.data?.wishlist || [];
            if (wishlist.length === 0) { container.innerHTML = '<p class="empty-hint">Ваш список бажань поки порожній 🐝</p>'; return; }
            container.innerHTML = wishlist.map(item => `<div class="wishlist-item"><span>🍯</span><span>${item}</span></div>`).join('');
        }

        async function renderOrders() {
            const container = document.getElementById('userOrdersList');
            if (!currentUser || !currentUser.login) return;
            container.innerHTML = '<p>Завантаження замовлень...</p>';
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?phone=eq.${encodeURIComponent(currentUser.login)}&order=created_at.desc`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
                const orders = await response.json();
                if (!orders || orders.length === 0) { container.innerHTML = '<p class="empty-hint">У вас поки немає замовлень.</p>'; return; }
                let html = '';
                orders.forEach(ord => {
                    const date = ord.created_at ? new Date(ord.created_at).toLocaleString('uk-UA') : 'Не вказано';
                    const itemsDisplay = typeof ord.items === 'string' ? ord.items : JSON.stringify(ord.items);
                    html += `
                    <div class="order-card">
                        <div class="order-header"><span class="order-date">📅 ${date}</span><span class="status-badge">${ord.status || 'Нове'}</span></div>
                        <div class="order-total">Сума: ${ord.total_price || 0} грн</div>
                        <button class="btn-details" onclick="toggleOrderDetails(this)">Деталі замовлення</button>
                        <div class="order-details"><strong>Склад замовлення:</strong><br>${itemsDisplay.replace(/\n/g, '<br>')}<br><br><em>Адреса: ${currentUser.address || 'Не вказана'}</em></div>
                    </div>`;
                });
                container.innerHTML = html;
                // Пересчитываем высоту аккордеона после загрузки
                const body = container.closest('.accordion-body');
                if (body && body.parentElement.classList.contains('open')) body.style.maxHeight = body.scrollHeight + "px";
            } catch (err) { console.error(err); container.innerHTML = '<p style="color:red">Помилка завантаження замовлень.</p>'; }
        }

        document.addEventListener('DOMContentLoaded', initAccountPage);
    </script>
</body>
</html>
